{% load i18n %}
<div id="advanced_search_filter"
      class="flex flex-row items-center px-2 py-1 mb-1 md:mb-2 text-sm rounded-md gap-x-1 w-40
            bg-slate-200 text-slate-700 dark:text-slate-300 dark:bg-slate-700
            border border-slate-400/70 dark:border-slate-500">
  <a id="adjust_advanced_search"
     class="flex flex-row items-center"
     href="{% url 'advanced_search' %}{% querystring %}">
    {% include 'includes/svg/search.html' with size='4' %}
    <span>{% trans 'Adjust Search' %}</span>
    <span class="ml-1">|</span>
  </a>
  <a href="{% url 'pdf_overview' %}" id="advanced_search_filter_close"
      class="dark:hover:text-white hover:text-black hover:cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" class="w-4 h-auto">
          <path d="M18 7 6 19"></path>
          <path d="m6 7 12 12"></path>
      </svg>
  </a>
</div>
