<messages>
  {% if messages %}
  <div x-data="{ showMessage: false }">
  {% for message in messages %}
    <div class="absolute top-1 md:top-2 md:right-3 z-50">
      <div class="alert-{{ message.tags }} flex flex-row justify-between items-center gap-x-3 px-4 py-3
                  w-screen md:w-100 text-slate-100 rounded-md"
           role="alert"
           x-cloak
           x-show="showMessage"
           x-init="setTimeout(() => showMessage = true, 200), setTimeout(() => showMessage = false, 6000)"
           x-transition:enter="duration-700 ease-out"
           x-transition:enter-start="opacity-0 -translate-y-5"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="duration-200 ease-in"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-5">
          <div>
              <div class="text-lg">{{ message }}</div>
          </div>
          <div class="cursor-pointer" @click="showMessage = false">
              <svg class="w-6 h-6 text-slate-200 hover:text-white" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" class="w-8 h-8 ml-2">
                  <path d="M6 18L18 6M6 6l12 12"></path>
              </svg>
          </div>
      </div>
    </div>
  {% endfor %}
  </div>
  {% endif %}
</messages>
