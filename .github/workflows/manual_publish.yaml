name: PdfDing Manual Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for manual publishing
        type: string
        required: true
        default: dev
      platform:
        description: Architecture for manual publishing
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      branch:
        description: Branch for manual publishing
        type: string
        required: true
        default: master

jobs:
  manual_publish:
    name: Manual Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v.7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: mrmn
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            CI_COMMIT_TAG=${{ inputs.tag }}
          push: true
          tags: |
            mrmn/pdfding:${{ inputs.tag }}
          platforms: ${{ inputs.platform }}
